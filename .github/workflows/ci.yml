name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Test, & JaCoCo Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 26 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Execute Maven Verification (mvn verify)
        run: mvn clean verify

      - name: Docker Container Readiness Test
        run: |
          docker build -t options-engine .
          docker run -d -p 8080:8080 -e API_SECRET=ci-only-dummy-secret-0123456789abcdef -e OPERATOR_PASSWORD=ci-only-operator-pass -e BIND_ADDRESS=0.0.0.0 --name options-app options-engine
          sleep 10
          docker logs options-app | tail -n 50
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/health)
          echo "Unauthenticated /api/health -> HTTP $code"
          [ "$code" = "401" ] || { docker rm -f options-app; exit 1; }
          docker rm -f options-app

      - name: Upload JaCoCo Code Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/

  secret-scan:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
