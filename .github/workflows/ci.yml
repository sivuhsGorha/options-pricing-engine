name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test, & JaCoCo Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Execute Maven Verification (mvn verify)
        run: mvn -B --no-transfer-progress clean verify

      - name: Python script tests
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v

      - name: Docker Container Readiness Test
        run: |
          docker build -t options-engine .
          trap 'docker rm -f options-app >/dev/null 2>&1 || true' EXIT
          docker run -d -p 8080:8080 -e API_SECRET=ci-only-dummy-secret-0123456789abcdef -e OPERATOR_PASSWORD=ci-only-operator-pass -e BIND_ADDRESS=0.0.0.0 --name options-app options-engine
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/health || true)
            [ "$code" != "000" ] && break
            sleep 1
          done
          docker logs options-app | tail -n 50
          echo "Unauthenticated /api/health -> HTTP $code"
          [ "$code" = "401" ]

      - name: Upload JaCoCo Code Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-react
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  secret-scan:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
