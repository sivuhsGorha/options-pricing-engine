<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">Blackthorn Sterling</title>
  <defs>
    <linearGradient id="v" x1="12" y1="14" x2="52" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9900"/>
      <stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0A1017" stroke="#1C2A38" stroke-width="1.5"/>
  <!-- the volatility smile: arcs spreading from the strike -->
  <g fill="none" stroke="url(#v)" stroke-linecap="round" stroke-width="2.2">
    <path d="M27.90 36.72 A12 12 0 0 1 36.10 36.72" opacity="0.95"/>
    <path d="M25.82 28.98 A20 20 0 0 1 38.18 28.98" opacity="0.62"/>
    <path d="M24.28 21.08 A28 28 0 0 1 39.72 21.08" opacity="0.34"/>
  </g>
  <!-- a long straddle's payoff: a V, lowest at the strike -->
  <path d="M12 14 L32 48 L52 14" fill="none" stroke="url(#v)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="48" r="3.4" fill="#FFFFFF"/>
</svg>
