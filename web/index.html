<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institutional Options Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Top Header -->
    <header class="sys-header">
        <div class="sys-title">SBK Options Pricing Engine</div>
        <div class="sys-status">
            <span class="status-dot"></span>
            <span class="status-text">CONNECTED</span>
            <span class="status-ping" id="latency">0ms</span>
        </div>
    </header>

    <!-- Main Grid Layout -->
    <div class="layout-grid">
        
        <!-- Left Panel: Risk Matrix -->
        <div class="panel risk-panel">
            <div class="panel-header">PORTFOLIO RISK MATRIX</div>
            <div class="panel-content">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>METRIC</th>
                            <th class="align-right">VALUE</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr id="row-delta">
                            <td>NET DELTA</td>
                            <td class="align-right mono" id="val-delta">--</td>
                        </tr>
                        <tr id="row-gamma">
                            <td>NET GAMMA</td>
                            <td class="align-right mono" id="val-gamma">--</td>
                        </tr>
                        <tr id="row-vega">
                            <td>NET VEGA</td>
                            <td class="align-right mono" id="val-vega">--</td>
                        </tr>
                    </tbody>
                </table>

                <div class="margin-block" id="margin-block">
                    <div class="margin-label">SPAN INITIAL MARGIN</div>
                    <div class="margin-value mono" id="val-margin">--</div>
                </div>

                <div class="panel-header mt-auto">SYSTEM LOG</div>
                <div class="log-container" id="sys-logs">
                    <div class="log-entry"><span class="log-time">[12:00:00]</span> Engine started.</div>
                </div>
            </div>
        </div>

        <!-- Center Panel: Volatility Surface -->
        <div class="panel chart-panel">
            <div class="panel-header">SABR IMPLIED VOLATILITY SURFACE</div>
            <div class="panel-content no-padding">
                <div id="volatilityChart"></div>
            </div>
        </div>

        <!-- Right Panel: Live Tape -->
        <div class="panel tape-panel">
            <div class="panel-header">LIVE MARKET TAPE</div>
            <div class="panel-content no-padding">
                <table class="data-table tape-table">
                    <thead>
                        <tr>
                            <th>INSTRUMENT</th>
                            <th class="align-right">SIZE</th>
                            <th class="align-right">PRICE</th>
                        </tr>
                    </thead>
                    <tbody id="tape-body">
                        <!-- JS generated rows -->
                    </tbody>
                </table>
            </div>
        </div>
        
    </div>

    <script src="app.js"></script>
</body>
</html>
