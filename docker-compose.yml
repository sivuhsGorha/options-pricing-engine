# One-command local deployment. Secrets and keys come from .env (copy .env.example; never commit .env).
#   docker compose up --build -d      # build the frontend and the jar, start on http://127.0.0.1:8080
#   docker compose logs -f            # engine log (market data status, halts, calibration)
#   docker compose down               # stop; the fill ledger and state file stay in the named volume
services:
  options-engine:
    build: .
    image: options-pricing-engine:local
    env_file: .env
    environment:
      # Inside the container the server must listen on all interfaces; the ports below publish it to
      # localhost only, so nothing outside this machine can reach it without a reverse proxy.
      BIND_ADDRESS: 0.0.0.0
      MMAP_STATE_FILE: /app/data/shm_state.dat
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    volumes:
      - engine-data:/app/data
      # config.yaml is not baked into the image; without this the container starts on defaults (simulator)
      - ./config.yaml:/app/config.yaml:ro
    # always, not unless-stopped: with unless-stopped a container that was ever stopped by hand (docker compose stop) stays down after a reboot, and the engine
    # then sat off for two days. With always it comes back whenever Docker starts, and goes down only when Docker does.
    restart: always
    # time for the engine to write its final heartbeat and send "ENGINE STOPPED" when Docker or the laptop shuts down (the default is 10 s)
    stop_grace_period: 30s

volumes:
  engine-data:
