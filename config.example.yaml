# Copy to config.yaml. Secrets never go here: API keys and passwords live in .env (see .env.example).
market_data:
  # Option-chain sources, tried in order; a synthetic chain is always the last fallback and is labelled DEMO.
  # cboe: Cboe's public delayed-quotes feed (all expiries, no key, 15-minute delayed).
  # yahoo_finance: needs a cookie/crumb Yahoo no longer grants to plain requests; kept for completeness.
  sources: [cboe]
  refresh_interval_seconds: 900      # how often the surface is re-fitted
  quote_refresh_seconds: 60          # how often the option chain is reloaded between re-fits; a quote is STALE 120 s after the feed stamped it
  record_chain_snapshots: true       # keep a gzip snapshot of every chain the feed changes, under data/chain_snapshots, for replay and backtests
  risk_free_rate: 0.05               # flat rate used for forwards and pricing
  dividend_yield: 0.012              # continuous yield of the underlying (SPY pays ~1.2%)
volatility:
  default_volatility: 0.2            # volatility of the synthetic fallback chain
risk:
  max_notional: 1000000.0
  max_delta: 5000.0
  max_gamma: 1000.0
  max_vega: 10000.0
  # max_theta: 2000.0               # optional: halt when |net theta| (per year, as the pricer reports it; 2000 is about $5.50 a day) exceeds this. Unset: shown, not limited
  # max_rho: 50000.0                # optional: halt when |net rho| (per 1.00 of rate) exceeds this. Unset: shown, not limited
  max_position: 10000.0
  max_spread_bps: 200.0              # refuse an order into a market wider than this (basis points of the mid); a field the feed does not publish is not judged
  min_volume: 1                      # refuse an order into a contract or share that has traded less than this today
  # Auto-hedging configuration (experimental - not yet wired into the application)
  # auto_hedge:
  #   enabled: false                   # enable automatic delta hedging
  #   hedge_band: 50                   # hedge when |net delta| exceeds this many shares
  #   mode: immediate                  # immediate | threshold | adaptive
  #   min_hedge_size: 10               # minimum hedge size in shares
  #   hedge_duration_seconds: 60      # minimum duration delta must be exceeded before hedging (threshold mode only)
  # Dynamic Greek limits (experimental - not yet wired into the application)
  # dynamic_limits:
  #   enabled: false                   # enable dynamic Greek limits based on volatility regime
  #   window_size: 60                 # number of volatility points to consider
  #   low_threshold: 0.5               # volatility below this (relative to average) is LOW regime
  #   high_threshold: 1.5             # volatility above this is HIGH regime
  #   extreme_threshold: 2.5           # volatility above this is EXTREME regime
execution:
  symbol: SPY
  transport: paper                   # paper: in-process simulated fills; alpaca: an Alpaca PAPER account (keys in .env)
  fill_wait_seconds: 10
  limit_cushion_bps: 0               # set limits this many bps past the touch (a buy higher, a sell lower); 0 = at the touch, max 500              # alpaca only: how long to wait for a fill before cancelling the remainder
  slippage_bps: 25                   # paper transport only: fills move this far against you
  contract_multiplier: 1             # 100 for standard equity options
strategy:
  mode: vol_spread                   # vol_spread: front-month ATM straddle vs the fitted surface; momentum: shares on a price move
  # vol_spread parameters
  vol_edge: 0.01                     # open when the straddle's market IV is more than 1 vol point from the reference
  reference_model: SSVI              # the smoothed global surface (an SVI slice sits on the quotes and carries no signal)
  hedge_band: 50                     # hedge with shares when |net delta| exceeds this many shares
  min_days_to_expiry: 14             # never open on an expiry closer than this
  max_days_to_expiry: 7              # close an open straddle when its expiry is this close
  contracts: 1                       # straddle size per leg
  fee_per_contract: 0.65             # dollars per contract per leg; the edge must also beat (half-spread + fee) / vega, in and out
  fair_vol_model: NONE               # NONE | EWMA | HAR: a realized-vol forecast shown beside each hold (needs ALPACA keys for daily closes); never trades
  side: long_only                    # long_only (default): only buy straddles | both: also sell them | short_only. A short straddle is two uncovered short options; whether the account may place them is unchecked
  use_multi_leg: false               # EXPERIMENTAL: send a buy straddle as one Alpaca order; a short leg is refused by the transport
  option_interval_seconds: 30        # how often the straddle is evaluated (the quotes it reads are reloaded every quote_refresh_seconds)
  # momentum parameters
  base_quantity: 10
  trigger_pct: 0.001                 # 0.1% move between two quotes fires one signal
# The dashboard's address is not set here: PORT (default 8080) and BIND_ADDRESS (default 127.0.0.1) in .env.
