# Copy to config.yaml. Secrets never go here: API keys and passwords live in .env (see .env.example).
market_data:
  # Option-chain sources, tried in order; a synthetic chain is always the last fallback and is labelled DEMO.
  # cboe: Cboe's public delayed-quotes feed (all expiries, no key, 15-minute delayed).
  # yahoo_finance: needs a cookie/crumb Yahoo no longer grants to plain requests; kept for completeness.
  sources: [cboe]
  refresh_interval_seconds: 900      # how often the surface is re-fitted
  quote_refresh_seconds: 60          # how often the option chain is reloaded between re-fits; a quote is STALE 120 s after the feed stamped it
  live_data_enabled: true
  risk_free_rate: 0.05               # flat rate used for forwards and pricing
  dividend_yield: 0.012              # continuous yield of the underlying (SPY pays ~1.2%)
volatility:
  ssvi_enabled: true
  sabr_enabled: true
  default_volatility: 0.2            # volatility of the synthetic fallback chain
risk:
  max_notional: 1000000.0
  max_delta: 5000.0
  max_gamma: 1000.0
  max_vega: 10000.0
  max_position: 10000.0
  max_spread_bps: 200.0              # refuse an order into a market wider than this (basis points of the mid); a field the feed does not publish is not judged
  min_volume: 1                      # refuse an order into a contract or share that has traded less than this today
execution:
  symbol: SPY
  transport: paper                   # paper: in-process simulated fills; alpaca: an Alpaca PAPER account (keys in .env)
  fill_wait_seconds: 10              # alpaca only: how long to wait for a fill before cancelling the remainder
  slippage_bps: 25                   # paper transport only: fills move this far against you
  contract_multiplier: 1             # 100 for standard equity options
strategy:
  mode: vol_spread                   # vol_spread: front-month ATM straddle vs the fitted surface; momentum: shares on a price move
  # vol_spread parameters
  vol_edge: 0.01                     # open when the straddle's market IV is more than 1 vol point from the reference
  reference_model: SSVI              # the smoothed global surface (an SVI slice sits on the quotes and carries no signal)
  hedge_band: 50                     # hedge with shares when |net delta| exceeds this many shares
  min_days_to_expiry: 14             # never open on an expiry closer than this
  max_days_to_expiry: 7              # close an open straddle when its expiry is this close
  contracts: 1                       # straddle size per leg
  option_interval_seconds: 30        # how often the straddle is evaluated (quotes refresh every few minutes anyway)
  # momentum parameters
  base_quantity: 10
  trigger_pct: 0.001                 # 0.1% move between two quotes fires one signal
dashboard:
  port: 8082
  update_rate_hz: 20
